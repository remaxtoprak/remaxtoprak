# RE/MAX Toprak: site dosyaları remax-toprak-yayin.zip içinde.
# Her yayında zip açılır, yama.mjs düzenlemeleri uygulanır (fotoğraf kalitesi, ana sayfa,
# hesaplama araçları, SSS), site/ klasörü yayınlanır ve /api/ilanlar fonksiyonu çalışır.
# Yama bir parçayı bulamazsa derleme durur ve önceki sürüm yayında kalır.
[build]
  command = "rm -rf site && mkdir -p site && unzip -o -q remax-toprak-yayin.zip -d site && node yama.mjs site && (cp *.webp *.jpg *.jpeg *.png site/img/ 2>/dev/null; true)"
  publish = "site"
  functions = "site/netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
