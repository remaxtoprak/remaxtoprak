# RE/MAX Toprak: site dosyaları remax-toprak-yayin.zip içinde.
# Her yayında zip açılır, yama.mjs düzenlemeleri uygulanır (fotoğraf kalitesi, ana sayfa,
# hesaplama araçları, SSS), site/ klasörü yayınlanır ve /api/ilanlar fonksiyonu çalışır.
# Yama bir parçayı bulamazsa derleme durur ve önceki sürüm yayında kalır.
[build]
  command = "rm -rf site && mkdir -p site && unzip -o -q remax-toprak-yayin.zip -d site && node yama.mjs site && (node rozet.mjs site || true) && rm -f site/netlify.toml && (cp *.webp *.jpg *.jpeg *.png *.svg site/img/ 2>/dev/null; cp favicon.ico site/ 2>/dev/null; true)"
  publish = "site"
  functions = "site/netlify/functions"

# Temiz adresler (/danismanlar, /mahalle-baris ...): bilinmeyen tüm adresler index.html'e gider.
# Dosyalar ve /api/ilanlar fonksiyonu bu kuraldan önce gelir. Zip içindeki eski netlify.toml derlemede silinir,
# yoksa Netlify yayın klasöründeki o dosyanın kurallarını kullanıyor.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
